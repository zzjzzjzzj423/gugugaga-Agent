[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gugugaga"
version = "0.1.0"
description = "A compact S01-S17 coding-agent harness using SiliconFlow"
requires-python = ">=3.11"
dependencies = ["openai>=1.0", "python-dotenv>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gugugaga-web = "gugugaga.web:main"

[tool.setuptools.package-data]
gugugaga = ["web_assets/*"]

[tool.setuptools.packages.find]
include = ["gugugaga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
