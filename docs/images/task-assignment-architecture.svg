<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">任务分配架构：Lead 维护候选，用户明确指定，Agent 原子领取</title>
  <desc id="desc">任务变化触发持久化合并事件；Lead 根据角色、Prompt 和工具匹配候选并通过版本检查保存。人工指定可覆盖候选范围。轮询和模型工具共用原子领取，检查依赖、归属、在线空闲和自动领取开关。看板读取任务数据解释等待状态。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FBFCFF"/><stop offset="1" stop-color="#F1F5FA"/></linearGradient>
    <linearGradient id="lead" x2="1" y2="1"><stop stop-color="#8170E3"/><stop offset="1" stop-color="#6552C5"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#273B62" flood-opacity=".055"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#97A6BB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#7562D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#377DDD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#168979" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #17243D; letter-spacing: -.6px; }
      .heading { font-size: 21px; font-weight: 650; fill: #17243D; }
      .body { font-size: 16px; fill: #6B7890; }
      .small { font-size: 14px; fill: #6B7890; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.8px; fill: #8C98AC; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 14px; fill: #61718B; }
      .card { fill: white; stroke: #DFE6F0; stroke-width: 1; filter: url(#shadow); }
      .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #97A6BB; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="920" rx="24" fill="url(#bg)"/>
  <rect x="48" y="43" width="4" height="36" rx="2" fill="#7562D8"/>
  <text x="68" y="72" class="title">任务分配，从候选到执行</text>
  <text x="68" y="105" class="body">Lead 决定允许范围 · 用户保留指定权 · Task System 确定执行归属</text>
  <rect x="1070" y="48" width="162" height="32" rx="16" fill="#EDF0F8"/>
  <text x="1151" y="69" text-anchor="middle" class="eyebrow" style="fill:#61718B;letter-spacing:1px">TEAM DISPATCH / V1</text>

  <!-- Inputs: one capability or intent per column. -->
  <rect x="48" y="164" width="232" height="112" rx="16" fill="#F0EDF9" stroke="#E3DDF5"/>
  <text x="70" y="197" class="heading" style="font-size:18px;fill:#6958B2">任务与团队变化</text>
  <text x="70" y="229" class="body">任务创建、要求变化</text>
  <text x="70" y="253" class="body">成员能力变动、不匹配报告</text>

  <rect x="324" y="164" width="244" height="112" rx="16" fill="#F0EDF9" stroke="#E3DDF5"/>
  <text x="346" y="197" class="heading" style="font-size:18px;fill:#6958B2">成员能力上下文</text>
  <rect x="346" y="218" width="52" height="30" rx="8" fill="white"/>
  <rect x="408" y="218" width="70" height="30" rx="8" fill="white"/>
  <rect x="488" y="218" width="58" height="30" rx="8" fill="white"/>
  <text x="372" y="239" text-anchor="middle" class="small" style="fill:#7562D8">角色</text>
  <text x="443" y="239" text-anchor="middle" class="small" style="fill:#7562D8">Prompt</text>
  <text x="517" y="239" text-anchor="middle" class="small" style="fill:#7562D8">工具</text>

  <rect x="620" y="164" width="300" height="112" rx="16" fill="#EDF4FF" stroke="#D9E6FC"/>
  <text x="642" y="197" class="heading" style="font-size:18px;fill:#377DDD">用户明确指定</text>
  <text x="642" y="229" class="body">查看全部，可指定候选外成员</text>
  <text x="642" y="253" class="body">指定前检查依赖与成员占用</text>

  <rect x="976" y="164" width="256" height="112" rx="16" fill="#EAF6F3" stroke="#D4EAE4"/>
  <text x="998" y="197" class="heading" style="font-size:18px;fill:#168979">Agent 的两个领取入口</text>
  <text x="998" y="229" class="body">空闲轮询</text>
  <text x="998" y="253" class="body">模型工具 claim_task</text>

  <path d="M164 276 V342" class="connector"/>
  <path d="M446 276 V342" class="connector" style="stroke:#7562D8;marker-end:url(#purple-arrow)"/>
  <path d="M770 276 V342" class="connector" style="stroke:#377DDD;marker-end:url(#blue-arrow)"/>
  <path d="M1104 276 V342" class="connector" style="stroke:#168979;marker-end:url(#green-arrow)"/>

  <!-- Main path: four aligned cards, no crossing connectors. -->
  <text x="48" y="320" class="eyebrow">01 / EVENT</text>
  <text x="324" y="320" class="eyebrow">02 / MATCH</text>
  <text x="620" y="320" class="eyebrow">03 / STORE</text>
  <text x="976" y="320" class="eyebrow">04 / CLAIM</text>

  <rect x="48" y="348" width="232" height="218" rx="18" class="card"/>
  <rect x="70" y="369" width="36" height="36" rx="10" fill="#F0EDF9"/>
  <g class="icon" stroke="#7562D8" transform="translate(79 378)"><path d="M0 3 H18 M0 9 H13 M0 15 H9"/><path d="M14 12 18 15 14 18"/></g>
  <text x="70" y="440" class="heading">合并待匹配事件</text>
  <text x="70" y="472" class="body">任务 JSON 持久保存</text>
  <text x="70" y="497" class="body">重复原因合并，版本递增</text>
  <text x="70" y="541" class="small">仅未领取、未人工指定的任务</text>

  <path d="M282 452 H318" class="connector" style="stroke:#7562D8;marker-end:url(#purple-arrow)"/>
  <rect x="324" y="348" width="244" height="218" rx="18" fill="url(#lead)" filter="url(#shadow)"/>
  <rect x="346" y="369" width="36" height="36" rx="10" fill="white" fill-opacity=".17"/>
  <g class="icon" stroke="white" transform="translate(353 376)"><circle cx="11" cy="5" r="4"/><path d="M3 20 V17 C3 11 19 11 19 17 V20 M0 20 H22"/></g>
  <text x="346" y="440" class="heading" style="fill:white">Lead 维护候选</text>
  <text x="346" y="472" class="body" style="fill:#EEEAFE">任务要求 × 成员能力</text>
  <text x="346" y="497" class="body" style="fill:#EEEAFE">保存候选名单与分配理由</text>
  <text x="346" y="541" class="small" style="fill:#E1D9FF">版本过期 → 读取新上下文重评</text>

  <path d="M570 452 H614" class="connector" style="stroke:#7562D8;marker-end:url(#purple-arrow)"/>
  <rect x="620" y="348" width="300" height="218" rx="18" class="card"/>
  <rect x="642" y="369" width="36" height="36" rx="10" fill="#EDF4FF"/>
  <g class="icon" stroke="#377DDD" transform="translate(650 377)"><rect x="0" y="0" width="20" height="20" rx="4"/><path d="M6 0 V20 M6 7 H20 M6 13 H20"/></g>
  <text x="690" y="394" class="heading">Task System</text>
  <line x1="642" y1="420" x2="898" y2="420" stroke="#E9EDF4"/>
  <text x="642" y="451" class="body" style="fill:#7562D8">候选</text><text x="704" y="451" class="mono">candidate_members</text>
  <text x="642" y="482" class="body" style="fill:#377DDD">指定</text><text x="704" y="482" class="mono">assignee</text>
  <text x="642" y="513" class="body" style="fill:#168979">归属</text><text x="704" y="513" class="mono">owner</text>
  <text x="642" y="545" class="small">三者分开保存 · 候选写入经过版本校验</text>

  <path d="M922 452 H970" class="connector" style="stroke:#168979;marker-end:url(#green-arrow)"/>
  <rect x="976" y="348" width="256" height="218" rx="18" class="card"/>
  <rect x="998" y="369" width="36" height="36" rx="10" fill="#EAF6F3"/>
  <g class="icon" stroke="#168979" transform="translate(1007 377)"><rect x="0" y="8" width="18" height="13" rx="3"/><path d="M4 8 V4 A5 5 0 0 1 14 4 V8 M9 13 V16"/></g>
  <text x="1046" y="394" class="heading">原子领取</text>
  <text x="998" y="440" class="body">候选资格 / 人工指定</text>
  <text x="998" y="466" class="body">依赖完成 · 无 Owner</text>
  <text x="998" y="492" class="body">成员在线可用 · 无执行任务</text>
  <text x="998" y="518" class="body">自动开关 / 明确指定</text>
  <text x="998" y="545" class="small" style="fill:#168979">全部条件在同一临界区重查</text>

  <path d="M770 568 V620" class="connector" style="stroke-dasharray:4 5"/>
  <path d="M1104 568 V620" class="connector" style="stroke:#168979;marker-end:url(#green-arrow)"/>

  <!-- Supporting rules and observable results. -->
  <rect x="48" y="626" width="520" height="218" rx="18" fill="#F0F3F8" stroke="#E3E9F1"/>
  <text x="72" y="662" class="eyebrow" style="fill:#61718B">BOUNDARIES / 调度边界</text>
  <circle cx="79" cy="701" r="5" fill="#7562D8"/>
  <text x="96" y="707" class="body" style="fill:#35435E">候选为空或都忙 → 等待，范围不扩大</text>
  <circle cx="79" cy="747" r="5" fill="#377DDD"/>
  <text x="96" y="753" class="body" style="fill:#35435E">人工指定优先 → 其他成员不能抢走</text>
  <circle cx="79" cy="793" r="5" fill="#168979"/>
  <text x="96" y="799" class="body" style="fill:#35435E">自动领取关闭 → 候选更新不启动任务</text>

  <rect x="620" y="626" width="300" height="218" rx="18" class="card"/>
  <text x="642" y="665" class="heading">看板解释</text>
  <text x="642" y="697" class="body">候选 · 理由 · 指定 · 实际 Owner</text>
  <line x1="642" y1="718" x2="898" y2="718" stroke="#E9EDF4"/>
  <text x="642" y="748" class="body">尚未匹配 / 依赖未完成</text>
  <text x="642" y="776" class="body">候选都忙或不在线</text>
  <text x="642" y="804" class="body">不匹配退出，等待重新分配</text>

  <rect x="976" y="626" width="256" height="218" rx="18" fill="#EAF6F3" stroke="#D4EAE4"/>
  <circle cx="1018" cy="667" r="17" fill="#168979"/>
  <path d="M1010 667 1016 673 1026 661" class="icon" stroke="white"/>
  <text x="1048" y="675" class="heading" style="fill:#147B6D">只有一位成功</text>
  <text x="998" y="714" class="body" style="fill:#35786F">Owner 确定 · in_progress</text>
  <text x="998" y="742" class="body" style="fill:#35786F">自动领取不改写人工指定</text>
  <line x1="998" y1="765" x2="1210" y2="765" stroke="#CEE4DE"/>
  <text x="998" y="796" class="small">校验不通过：拒绝本次领取</text>
  <text x="998" y="819" class="small">保留任务当前状态与归属</text>

  <text x="48" y="887" class="small">成员锁 → 任务 RLock → 跨进程 .state.lock</text>
  <text x="1232" y="887" text-anchor="end" class="small">匹配更新资格，领取确定归属。</text>
</svg>
